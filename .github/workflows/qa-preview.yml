name: The Pianist — regression and signed preview
on:
  push:
    branches: [audit/gameplay-engine-refactor-v0-5]
    paths:
      - editable/**
      - qa/*.cjs
      - .github/workflows/qa-preview.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source and regression tests
        run: |
          set -euo pipefail
          node --check editable/app/src/main/assets/game-config.js
          node --check editable/app/src/main/assets/game-physics.js
          node --check editable/app/src/main/assets/game.js
          node --test qa/engine.test.cjs
      - name: Prepare signed Android project from editable files
        shell: bash
        run: |
          set -euo pipefail
          ZIP=ThePianistAndroid-GitHubBuild-v0.4.5.zip
          unzip -tq "$ZIP"
          mkdir -p build-project
          unzip -q "$ZIP" -d build-project
          test -f build-project/app/pianist-prototype-signing.jks
          # Editable resources override the original ZIP, never signing secrets.
          rsync -a editable/app/src/main/ build-project/app/src/main/
          # Version bump must be monotonic; stable signing and applicationId remain.
          sed -i -e "s/versionCode 18/versionCode 19/" -e "s/versionName '0.4.5'/versionName '0.5.0'/" build-project/app/build.gradle
          grep -E "versionCode|versionName|applicationId" build-project/app/build.gradle
      - name: Browser simulation of apartment
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm install --no-save playwright-core@1.56.1
          (cd build-project/app/src/main/assets && python3 -m http.server 8033 --bind 127.0.0.1 > /tmp/pianist-http.log 2>&1) &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node qa/browser-roam.cjs
      - name: Set up Java
        if: success()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        if: success()
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        if: success()
        working-directory: build-project
        run: gradle assembleDebug --no-daemon
      - name: Publish preview and QA screenshots
        if: success()
        run: |
          mkdir -p out
          cp build-project/app/build/outputs/apk/debug/*.apk out/ThePianist-v0.5.0-preview.apk
          zip -qr out/ThePianist-v0.5.0-source.zip build-project -x '*/build/*' '*/.gradle/*' '*.apk'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ThePianist-v0.5.0-QA-and-preview
          path: |
            qa/screenshots/*.png
            out/*.apk
            out/*.zip
          if-no-files-found: warn
      - name: Commit QA screenshots for review
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/screenshots/*.png
          git diff --cached --quiet || (git commit -m "test: capture reproducible apartment poses" && git push)
