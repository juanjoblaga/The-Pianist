
name: Build The Pianist APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reassemble and extract The Pianist
        run: |
          mkdir -p build-project

          cat ThePianist-v0.3.7.part01 \
              ThePianist-v0.3.7.part02 > game-source.zip

          echo "9295b90f53819460f647039f66f16c544d3bfb1f094c6d3540154dd68f0fd0a6  game-source.zip" | sha256sum -c -

          unzip -q game-source.zip -d build-project

      - name: Build Android APK
        run: |
          PROJECT=$(find build-project -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "Android project not found!"
            exit 1
          fi

          cd "$PROJECT"
          gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p apk-output

          APK=$(find build-project -type f \
            -name 'app-debug.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          cp "$APK" apk-output/ThePianist-v0.3.7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThePianist-v0.3.7-APK
          path: apk-output/ThePianist-v0.3.7.apk
