
name: Build The Pianist APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract The Pianist
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'ThePianistAndroid-GitHubBuild-*.zip' | sort -V | tail -n 1)
          echo "Using ZIP: $ZIP"
          if [ -z "$ZIP" ]; then
            echo 'The Pianist source ZIP not found'
            exit 1
          fi
          mkdir -p build-project
          unzip -q "$ZIP" -d build-project

      - name: Build APK
        run: |
          PROJECT=$(find build-project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo 'Android Gradle project not found'
            exit 1
          fi
          cd "$PROJECT"
          gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          APK=$(find build-project -type f -name 'app-debug.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo 'APK not found'
            exit 1
          fi
          mkdir -p apk-output
          cp "$APK" apk-output/ThePianist-v0.1.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThePianist-v0.1.0-APK
          path: apk-output/ThePianist-v0.1.0-debug.apk
          if-no-files-found: error
