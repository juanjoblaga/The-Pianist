
name: Build The Pianist APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract latest The Pianist source
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 1 -type f -name 'ThePianistAndroid-GitHubBuild-v*.zip' -printf '%f\n' | sort -V | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "No source ZIP found in repository root"
            exit 1
          fi

          echo "Building source from: $ZIP"
          unzip -tq "$ZIP"

          rm -rf build-project
          mkdir -p build-project
          unzip -q "$ZIP" -d build-project

      - name: Build signed debug APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=$(find build-project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "Android Gradle project not found"
            exit 1
          fi

          cd "$PROJECT"
          gradle --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find build-project -type f -name 'app-debug.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK" apk-output/ThePianist-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThePianist-Android-APK
          path: apk-output/ThePianist-debug.apk
          if-no-files-found: error
