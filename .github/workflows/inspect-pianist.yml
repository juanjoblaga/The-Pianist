name: Inspect The Pianist game source
on:
  push:
    paths:
      - '.github/workflows/inspect-pianist.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archived game (read-only)
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, zipfile, re, os
          paths=sorted(glob.glob("ThePianistAndroid-GitHubBuild-v*.zip"))
          if not paths: raise SystemExit("No source ZIP")
          path=paths[-1]
          with zipfile.ZipFile(path) as z:
              infos=z.infolist()
              print("AUDIT ZIP:", path, "size:", os.stat(path).st_size, "members:", len(infos))
              print("=== FILE MANIFEST START ===")
              for i in infos:
                  if i.filename.endswith('/'): continue
                  print(str(i.file_size).rjust(9), i.filename)
              print("=== FILE MANIFEST END ===")
              matches=re.compile(r'sprite|piano|sitt|lie|lying|lay|sofa|bed|shower|dialog|draw|interact|sheet|frame|animat|scale|touch|joystick|canvas|action',re.I)
              sources=[i for i in infos if i.filename.lower().endswith(('.js','.html','.css','.java','.kt','.gradle','.json','.xml')) and 0<i.file_size<1000000]
              print("=== SOURCE MATCHES START ===")
              for i in sources:
                  if i.filename.lower().endswith(('package-lock.json','gradle-wrapper.properties')): continue
                  try: s=z.read(i).decode('utf-8')
                  except UnicodeError: continue
                  lines=s.splitlines()
                  indices=[idx for idx,line in enumerate(lines) if matches.search(line)]
                  if not indices: continue
                  print("=== SOURCE:",i.filename,"LINES",len(lines),"MATCHES",len(indices),"===")
                  if len(lines)<500 and len(indices)<100:
                      print('\n'.join(f"{j+1:04d}: {ln[:300]}" for j,ln in enumerate(lines)))
                  else:
                      chosen=set()
                      for j in indices[:130]:
                          for k in range(max(0,j-2),min(len(lines),j+3)): chosen.add(k)
                      for j in sorted(chosen):
                          print(f"{j+1:04d}: {lines[j][:400]}")
              print("=== SOURCE MATCHES END ===")
              import base64
              print("=== SITTING_IMAGE_B64_START ===")
              print(base64.b64encode(z.read("app/src/main/assets/sitting_indoor.png")).decode("ascii"))
              print("=== SITTING_IMAGE_B64_END ===")
              print("=== DETAILED SPRITE RENDER SOURCE START ===")
              path='app/src/main/assets/game.js'
              lines=z.read(path).decode('utf-8').splitlines()
              for i,line in enumerate(lines):
                  if (1<=i+1<=45) or (510<=i+1<=len(lines)):
                      print(f"{i+1:04d}: {line}")
              print("=== DETAILED SPRITE RENDER SOURCE END ===")
              for entry in ("README.md","QA_NOTES.md","app/build.gradle","app/src/main/assets/index.html"):
                  print("=== EXCERPT:",entry,"===")
                  for ix,line in enumerate(z.read(entry).decode('utf-8').splitlines()):
                      print(f"{ix+1:04d}: {line}")
              for entry in ("app/src/main/assets/sitting_indoor.png","app/src/main/assets/piano_play_v045.png","app/src/main/assets/beanbag_clean_v042.png"):
                  b=z.read(entry)
                  import struct
                  print("IMAGE",entry,"pixels",struct.unpack('>II',b[16:24]),"bytes",len(b))

          PY

      - name: Export v0.4.5 source for compatibility inspection
        uses: actions/upload-artifact@v4
        with:
          name: ThePianist-v0.4.5-original-source
          path: ThePianistAndroid-GitHubBuild-v0.4.5.zip
          if-no-files-found: error
