name: The Pianist v0.6.5 — signed APK from verified source

on:
  push:
    branches:
      - delivery/v0-6-5-apk
    paths:
      - incoming/ThePianist_v0.6.5_Editable_Source_Preview.zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate uploaded source and version identity
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="incoming/ThePianist_v0.6.5_Editable_Source_Preview.zip"
          test -s "$ARCHIVE"
          printf '%s  %s\n' "61d04ec2a56945ca425dcef10d50d00f36dd39297fa08f3e5096074fc645e794" "$ARCHIVE" | sha256sum --check
          unzip -tq "$ARCHIVE"
          mkdir -p source
          unzip -q "$ARCHIVE" -d source
          test -f source/app/src/main/assets/station-scene.js
          test -f source/app/src/main/assets/station_world.png
          test -f source/app/src/main/assets/station_obj_tram.png
          test -f source/app/src/main/assets/VERSION.json
          python -m pip install --quiet pillow
          python source/qa/verify_integrity.py
          find source/app/src/main/assets -name '*.js' -print0 | xargs -0 -n1 node --check
          test "$(find source -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' \) | wc -l)" -eq 0

      - name: Restore original Android signing baseline and overlay current game
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq ThePianistAndroid-GitHubBuild-v0.4.5.zip
          mkdir -p build-project
          unzip -q ThePianistAndroid-GitHubBuild-v0.4.5.zip -d build-project
          test -f build-project/app/pianist-prototype-signing.jks
          # This full source replaces old game assets, not the pinned signing config.
          rsync -a --delete source/app/src/main/assets/ build-project/app/src/main/assets/
          rsync -a source/app/src/main/java/ build-project/app/src/main/java/
          rsync -a source/app/src/main/res/ build-project/app/src/main/res/
          cp source/app/src/main/AndroidManifest.xml build-project/app/src/main/AndroidManifest.xml
          python - <<'PY'
          import json, re
          from pathlib import Path
          meta = json.loads(Path('source/VERSION.json').read_text())
          assert meta['versionName'] == '0.6.5' and meta['versionCode'] == 34
          gradle = Path('build-project/app/build.gradle')
          original = gradle.read_text()
          assert re.search(r"applicationId\s+['\"]com\.thepianist\.game['\"]", original), 'Unexpected applicationId'
          code = re.search(r'\bversionCode\s+(\d+)', original)
          assert code and int(code.group(1)) < 34, 'Invalid baseline versionCode'
          assert re.search(r'\bversionName\s+[\'\"][^\'\"]+[\'\"]', original), 'Missing baseline versionName'
          replacement = re.sub(r'\bversionCode\s+\d+', 'versionCode 34', original, count=1)
          replacement = re.sub(r'\bversionName\s+[\'\"][^\'\"]+[\'\"]', "versionName '0.6.5'", replacement, count=1)
          gradle.write_text(replacement)
          print('Verified original application ID and signing baseline; set v0.6.5/code34')
          PY

      - name: Build Android APK using original signing baseline
        working-directory: build-project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK version and matching signing certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(find build-project/app/build/outputs/apk -type f -name 'app-debug.apk' | head -n 1)
          test -s "$APK"
          cp "$APK" out/ThePianist-v0.6.5.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs out/ThePianist-v0.6.5.apk | tee out/signature-details.txt
          python - <<'PY'
          import re
          from pathlib import Path
          data=Path('out/signature-details.txt').read_text()
          found=re.search(r'Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]+)',data)
          expected='be1e4567fe575d944364ac4d24274558d494d7bd5309fcf2bdd67d5b06af8176'
          assert found and found.group(1).lower()==expected, 'APK signing certificate differs from v0.6.4; reject candidate'
          print('Signature matches v0.6.4 reference certificate')
          PY
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging out/ThePianist-v0.6.5.apk | grep -m1 'package:' | tee out/manifest-identity.txt
          grep -q "name='com.thepianist.game' versionCode='34' versionName='0.6.5'" out/manifest-identity.txt
          sha256sum out/ThePianist-v0.6.5.apk > out/apk.sha256

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ThePianist-v0.6.5-signed-APK
          path: |
            out/ThePianist-v0.6.5.apk
            out/apk.sha256
          if-no-files-found: error
          retention-days: 45
